scan-type: source

ignore:
  # - vulnerability: CVE-2025-3277 #  sqlite-libs 3.48.0-r2
  # - vulnerability: CVE-2024-9410 # ada-libs 2.9.2-r1

  # 2026-07-07: step-security/harden-runner@v2.15.0 is referenced by CI workflow files
  # shipped inside the published fido2-lib npm package (node_modules/fido2-lib/.github/).
  # Not a runtime dependency and not repo-owned — nothing to fix on our side.
  - vulnerability: GHSA-46g3-37rh-v698
    include-aliases: true
    package:
      name: step-security/harden-runner
      version: v2.15.0
  - vulnerability: GHSA-g699-3x6g-wm3g
    include-aliases: true
    package:
      name: step-security/harden-runner
      version: v2.15.0

# Set output format defaults
output:
  - "table"
  - "json"

# Modify your CircleCI job to check critical count
search:
  scope: "squashed"
quiet: false
check-for-app-update: false
